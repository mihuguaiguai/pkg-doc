<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作便捷工具</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --p50:#f3e8fb; --p100:#e1c9f4; --p200:#c79ae8;
  --p400:#9c5fd0; --p500:#8e3fc8; --p700:#6a2bb0;
  --bg:#f3f3f5; --card:#fff; --text:#2b1a3d; --mute:#7d6b91;
}
body { font-family:'Segoe UI','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; min-height:100vh; }

#pw-gate { position:fixed; inset:0; z-index:9999; background:linear-gradient(160deg,#7b2fbe,#9a4fd3); display:flex; align-items:center; justify-content:center; }
#pw-box { background:#fff; border-radius:14px; padding:38px 34px; width:340px; max-width:90vw; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35); }
#pw-box h2 { color:#6a2bb0; margin-bottom:6px; font-size:20px; }
#pw-box p { color:#7d6b91; font-size:13px; margin-bottom:16px; }
#pw-input { width:100%; padding:10px 12px; border:1.5px solid #e1c9f4; border-radius:8px; font-size:15px; text-align:center; outline:none; }
#pw-input:focus { border-color:#8e3fc8; }
#pw-input.pw-err { border-color:#d32f2f; animation:pwshake .3s; }
@keyframes pwshake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
#pw-btn { margin-top:14px; width:100%; padding:10px; border:none; border-radius:8px; background:linear-gradient(135deg,#a366d9,#6a2bb0); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
#pw-errmsg { color:#d32f2f; font-size:12.5px; margin-top:10px; min-height:16px; }

.hero { position:relative; text-align:center; color:#fff; padding:26px 20px 70px;
  background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.10),transparent 40%),linear-gradient(180deg,#7b2fbe 0%,#9a4fd3 100%); overflow:hidden; }
.hero::before { content:""; position:absolute; inset:0; opacity:.75; pointer-events:none;
  background-image:radial-gradient(1.5px 1.5px at 8% 28%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 17% 70%,#fff 50%,transparent 51%),
  radial-gradient(2px 2px at 27% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 36% 62%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 46% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 57% 55%,#fff 50%,transparent 51%),
  radial-gradient(2px 2px at 66% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 74% 72%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 83% 24%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 92% 60%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 12% 48%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 51% 80%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 88% 42%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 31% 84%,#fff 50%,transparent 51%); }
.hero-sub1 { position:relative; font-size:26px; font-weight:700; color:#f4a6d0; letter-spacing:1px; }
.hero-title { position:relative; font-size:30px; font-weight:800; margin-top:4px; text-shadow:0 2px 6px rgba(0,0,0,.25); }
.hero-sub2 { position:relative; font-size:14px; margin-top:8px; opacity:.92; letter-spacing:2px; }
.hero::after { content:""; position:absolute; left:-10%; right:-10%; bottom:-1px; height:46px; background:var(--bg); border-radius:50% 50% 0 0 / 100% 100% 0 0; }
.layout { display:flex; flex:1; min-height:0; }

.sidebar { width:210px; background:linear-gradient(160deg,#9b59d0,var(--p700)); color:#fff; flex-shrink:0; box-shadow:2px 0 12px rgba(122,48,190,.18); display:flex; flex-direction:column; }
.logo { padding:22px 18px 16px; font-size:17px; font-weight:800; border-bottom:1px solid rgba(255,255,255,.2); }
.logo span { opacity:.7; font-weight:400; font-size:12px; display:block; margin-top:3px; }
.nav-sec { padding:14px 16px 4px; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,.5); }
.nav-item { display:flex; align-items:center; gap:9px; padding:10px 14px; font-size:13.5px; cursor:pointer; border-left:3px solid transparent; border-radius:0 8px 8px 0; margin:2px 8px 2px 0; transition:all .15s; color:rgba(255,255,255,.85); }
.nav-item:hover { background:rgba(255,255,255,.15); color:#fff; }
.nav-item.active { background:rgba(255,255,255,.22); color:#fff; border-left-color:#fff; font-weight:600; }

.main { flex:1; padding:32px 36px; overflow-y:auto; max-width:860px; }
.task-panel { display:none; }
.task-panel.active { display:block; }
.page-header { margin-bottom:24px; }
.page-header h2 { font-size:21px; color:var(--p700); margin-bottom:5px; }
.page-header p { font-size:13px; color:var(--mute); line-height:1.6; }


.link-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
.link-card { display:block; text-decoration:none; color:var(--text); background:var(--card); border:1.5px solid var(--p100); border-radius:14px; padding:16px 18px; box-shadow:0 2px 10px rgba(122,48,190,.06); transition:all .18s; }
.link-card:hover { border-color:var(--p500); background:var(--p50); transform:translateY(-2px); box-shadow:0 5px 16px rgba(122,48,190,.18); }
.link-name { font-size:14.5px; font-weight:700; color:var(--p700); margin-bottom:5px; }
.link-url { font-size:11.5px; color:var(--mute); word-break:break-all; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
</style>
</head>
<body>
<div id="pw-gate">
  <div id="pw-box">
    <h2>🔒 工作便捷工具</h2>
    <p>请输入访问密码</p>
    <input id="pw-input" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')checkPW()" autocomplete="current-password">
    <button id="pw-btn" onclick="checkPW()">进入</button>
    <div id="pw-errmsg"></div>
  </div>
</div>

<div class="hero">
  <div class="hero-sub1">Work Helper</div>
  <div class="hero-title">工作便捷工具</div>
  <div class="hero-sub2">高效处理 · 一键完成 · 少做重复</div>
</div>
<div class="layout">
<div class="sidebar">
  <div class="logo">✨ 便捷工具<span>Work Helper</span></div>
  <div class="nav-sec">导航</div>
  <div class="nav-item active" onclick="showPanel('quick-links',this)">🔗 常用网站</div>
</div>

<div class="main">
  <!-- ── 常用网站 ── -->
  <div id="quick-links" class="task-panel active">
    <div class="page-header">
      <h2>🔗 常用网站</h2>
      <p>点击卡片在新标签页打开。需要增删网站时，修改页面底部脚本中的 QUICK_LINKS 列表即可。</p>
    </div>
    <div class="link-grid" id="link-grid"></div>
  </div>

</div>
</div><!-- /layout -->


<script>
// 密码锁
(function(){ if(sessionStorage.getItem('wh_auth')==='123') document.getElementById('pw-gate').style.display='none'; })();
function checkPW(){
  var inp=document.getElementById('pw-input');
  if(inp.value==='123'){
    sessionStorage.setItem('wh_auth','123');
    var g=document.getElementById('pw-gate'); g.style.transition='opacity .3s'; g.style.opacity='0';
    setTimeout(function(){ g.style.display='none'; },300);
  } else {
    inp.classList.add('pw-err'); document.getElementById('pw-errmsg').textContent='密码错误，请重试';
    setTimeout(function(){ inp.classList.remove('pw-err'); },400); inp.value=''; inp.focus();
  }
}
</script>
<script>
// 常用网站列表：按需修改名称 / 网址
var QUICK_LINKS = [
  { name: '物料标签审批系统', url: 'http://10.69.3.165:5156/login' },
  { name: '仓库化学品混合存储矩阵', url: 'https://apps.powerapps.com/play/e/default-db76fb59-a377-4120-bc54-59dead7d39c9/a/7e33af24-bec4-4e29-a7af-1b898c04cccc?tenantId=db76fb59-a377-4120-bc54-59dead7d39c9&hint=b7801b7a-f021-4956-8a33-b11c8ff376c1&sourcetime=1789870807613' },
  { name: '特殊来料登记包材网页', url: 'https://mihuguaiguai.github.io/pkg-doc/' },
  { name: '个人技能学习平台', url: 'https://mihuguaiguai.github.io/pkg-doc/work-framework.html' },
  { name: 'SAP 物料转库管理平台', url: 'http://10.69.96.45:3001/' },
  { name: '线下物料追踪', url: 'http://10.69.97.254:3000/admin/inbound' },
  { name: 'Merck Auth Service', url: 'https://10.69.3.165:5111/' },
  { name: '仓库库位可视化平台', url: 'http://10.69.97.20:8888/' },
  { name: 'SC 团队知识库', url: 'http://10.69.96.45:8080/#home' }
];
(function renderLinks() {
  var g = document.getElementById('link-grid');
  QUICK_LINKS.forEach(function(l) {
    var a = document.createElement('a');
    a.className = 'link-card'; a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
    var n = document.createElement('div'); n.className = 'link-name'; n.textContent = '🌐 ' + l.name;
    var u = document.createElement('div'); u.className = 'link-url'; u.textContent = l.url;
    a.appendChild(n); a.appendChild(u); g.appendChild(a);
  });
})();

function showPanel(id, el) {
  document.querySelectorAll('.task-panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}

</script>
</body>
</html>
