<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="robots" content="noindex">
<title>冷柜库位系统</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;align-items:center;justify-content:center;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle at 30% 20%,#1e3a5f,#0b1220 62%);
    color:#e2e8f0;padding:24px;
    -webkit-tap-highlight-color:transparent;
  }
  .card{
    width:100%;max-width:380px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);border-radius:18px;
    padding:28px 24px;text-align:center;backdrop-filter:blur(8px);
  }
  h1{font-size:20px;margin:0 0 6px;letter-spacing:.5px}
  .sub{font-size:13px;color:#94a3b8;margin-bottom:22px}
  .spinner{
    width:44px;height:44px;margin:0 auto 18px;border-radius:50%;
    border:3px solid rgba(255,255,255,.15);border-top-color:#38bdf8;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .status{font-size:14px;color:#cbd5e1;min-height:22px}
  .err{color:#fca5a5}
  a.btn{
    display:inline-block;margin:16px 4px 0;padding:11px 20px;border-radius:11px;
    background:#0ea5e9;color:#fff;text-decoration:none;font-size:15px;font-weight:600;
  }
  a.btn.alt{background:#334155}
  .hint{margin-top:22px;font-size:12px;color:#64748b;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <h1>冷柜库位系统</h1>
  <div class="sub">正在跳转…</div>
  <div class="spinner" id="sp"></div>
  <div class="status" id="st">正在获取服务器地址</div>
  <div id="act"></div>
  <div class="hint">连不上时请确认电脑已开机、网络正常，再点「重试」。</div>
</div>
<script>
(function () {
  var st   = document.getElementById('st');
  var sp   = document.getElementById('sp');
  var act  = document.getElementById('act');
  var sub  = document.querySelector('.sub');
  var hash = location.hash || '';
  var tries = 0;

  function fail(msg) {
    sp.style.display = 'none';
    st.className = 'status err';
    st.textContent = msg;
    sub.textContent = '暂时打不开';
    act.innerHTML =
      '<a class="btn" href="javascript:location.reload()">重试</a>' +
      '<a class="btn alt" href="http://10.69.97.20:8888/cabinet' + hash + '">内网直连</a>';
  }

  function go() {
    fetch('cabinet-url.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        if (!d || !d.url) throw new Error('地址为空');
        var base = String(d.url).replace(/\/+$/, '');
        var url  = base + '/cabinet' + (d.key ? '?k=' + encodeURIComponent(d.key) : '') + hash;
        st.textContent = '已连接，正在打开…';
        location.replace(url);
      })
      .catch(function (e) {
        if (tries++ < 2) { setTimeout(go, 700); return; }
        fail('取不到服务器地址（' + e.message + '）');
      });
  }

  go();
  setTimeout(function () {
    if (sp.style.display !== 'none') st.textContent = '网络较慢，仍在尝试…';
  }, 5000);
})();
</script>
</body>
</html>
